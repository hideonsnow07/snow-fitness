<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Snow的冰箱</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: fridge app. Three tabs; fridge = one shelf at a time + tray + recipe; sticky summary bar at the bottom; recipe detail opens as a full sheet. */
:root {
  --bg: #ecf2f0;
  --surface: #ffffff;
  --surface-2: #f2f6f5;
  --ink: #12201d;
  --muted: #5a6d68;
  --line: #d5e1dd;
  --accent: #0c7a69;
  --accent-ink: #ffffff;
  --kcal: #c4571a;
  --prot: #0c7a69;
  --fat: #b8860b;
  --carb: #3a67b0;
  --star: #e0a21b;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1614; --surface: #15211e; --surface-2: #1c2a27; --ink: #e5f0ed; --muted: #95aca6;
    --line: #2a3d38; --accent: #4cc8b2; --accent-ink: #062520; --kcal: #f08a4b; --prot: #4cc8b2;
    --fat: #e2b23a; --carb: #7ea6e8; --star: #f2b93b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1614; --surface: #15211e; --surface-2: #1c2a27; --ink: #e5f0ed; --muted: #95aca6;
  --line: #2a3d38; --accent: #4cc8b2; --accent-ink: #062520; --kcal: #f08a4b; --prot: #4cc8b2;
  --fat: #e2b23a; --carb: #7ea6e8; --star: #f2b93b; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-block: 18px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button, input, select { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { font-size: 28px; font-weight: 900; margin: 0; line-height: 1.2; }
h2 { font-size: 17px; font-weight: 700; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.tab { border: 0; background: transparent; padding: 9px 4px; border-radius: 9px; font-weight: 500; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.panel { display: flex; flex-direction: column; gap: 14px; }

.scroller { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.seg { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.seg[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 700; }
.seg .n { font-family: var(--font-num); font-size: 12px; margin-left: 3px; color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip.add { border-style: dashed; background: transparent; color: var(--muted); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row > * { min-width: 0; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--muted); }
.primary { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 10px; padding: 10px 14px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 0; }
.item b { font-weight: 500; }
.item small { color: var(--muted); display: block; font-size: 12px; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.step button { border: 0; background: var(--surface-2); width: 34px; height: 34px; font-size: 18px; line-height: 1; }
.step span { min-width: 76px; text-align: center; font-size: 12.5px; padding: 0 2px; }
.x { border: 0; background: transparent; color: var(--muted); font-size: 18px; width: 30px; height: 34px; }

.kcal { display: flex; align-items: baseline; gap: 6px; }
.kcal strong { font-size: 40px; line-height: 1; color: var(--kcal); font-weight: 500; }
.kcal span { color: var(--muted); font-size: 13px; }
.bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.bar i { display: block; height: 100%; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.macro { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.macro label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.macro label i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.macro strong { font-size: 20px; font-weight: 500; display: block; }
.macro small { color: var(--muted); font-size: 11px; }

.rname { font-size: 21px; font-weight: 900; line-height: 1.3; margin: 0; text-wrap: balance; }
ol.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
ol.steps li::marker { color: var(--accent); font-weight: 700; font-family: var(--font-num); }
.notes { margin: 0; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font-size: 14px; }
.stars { display: inline-flex; gap: 2px; }
.stars button { border: 0; background: transparent; font-size: 28px; line-height: 1; padding: 2px; color: var(--line); }
.stars button.on { color: var(--star); }
.stars.sm { pointer-events: none; }
.stars.sm button { font-size: 15px; padding: 0; }
.status { font-size: 12px; color: var(--muted); min-height: 18px; }
.sec-h { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; margin: 0; }

.rlist { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.rrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 12px 14px; width: 100%; }
.rrow:first-child { border-top: 0; }
.rrow:hover { background: var(--surface-2); }
.rrow .t { font-weight: 700; font-size: 15.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rrow .m { font-size: 12.5px; color: var(--muted); }
.rrow .k { text-align: right; grid-row: span 2; }
.rrow .k b { display: block; font-family: var(--font-num); font-weight: 500; color: var(--kcal); font-size: 17px; }
.rrow .k small { font-family: var(--font-num); color: var(--muted); font-size: 12px; }
.tag { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 0 6px; background: var(--surface-2); color: var(--accent); border: 1px solid var(--line); }
.tag.hot { background: var(--kcal); color: var(--surface); border-color: var(--kcal); }

.ing { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ing li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 14.5px; }
.ing li:first-child { border-top: 0; }
.ing li span:first-child { flex: none; }
.ing li span:last-child { font-family: var(--font-num); color: var(--muted); font-size: 13px; white-space: nowrap; }
.toggle { display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.toggle button { border: 0; background: transparent; border-radius: 8px; padding: 6px 14px; font-size: 14px; color: var(--muted); }
.toggle button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }

.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.sheet-top { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 0 8px; display: flex; align-items: center; justify-content: space-between; }
.back { border: 0; background: transparent; font-size: 16px; font-weight: 500; color: var(--accent); padding: 4px 0; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.dock-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dock-in div { font-size: 13px; color: var(--muted); line-height: 1.35; min-width: 0; }
.dock-in div b { font-family: var(--font-num); font-weight: 500; color: var(--ink); font-size: 15px; }

.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.form label.full { grid-column: 1 / -1; }
.form input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 9px; font-size: 16px; width: 100%; }
.foot { color: var(--muted); font-size: 12px; margin: 0; }
@media (prefers-reduced-motion: no-preference) { .tab, .chip, .seg { transition: background .15s, color .15s; } }

.pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.pair { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.pair b { font-weight: 700; font-size: 14px; color: var(--accent); }
.pair small { font-size: 12px; color: var(--muted); line-height: 1.35; }
.pair:hover { border-color: var(--accent); }
.iname { border: 0; background: transparent; text-align: left; padding: 0; min-width: 0; }
.iname b { font-weight: 500; display: block; }
.iname small { color: var(--muted); display: block; font-size: 12px; }
.item.focus .iname b { color: var(--accent); font-weight: 700; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.meter { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-size: 13px; }
.meter .ml { color: var(--muted); }
.meter .mt { height: 8px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.meter .mt i { display: block; height: 100%; border-radius: 5px; }
.meter.h .mt i { background: var(--prot); }
.meter.t .mt i { background: var(--kcal); }
.meter b { font-weight: 500; font-size: 15px; min-width: 26px; text-align: right; }
.rrow .m b { font-weight: 500; color: var(--ink); }
.times { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.times b { color: var(--ink); font-weight: 500; }
.kv { display: flex; flex-direction: column; gap: 3px; padding-top: 10px; border-top: 1px dashed var(--line); }
.kv:first-of-type { border-top: 0; padding-top: 0; }
.kv b { font-size: 13px; color: var(--muted); }
.kv p, .kv ul { margin: 0; font-size: 14.5px; }
.kv ul { padding-left: 18px; }
.seas { font-family: var(--font-body) !important; white-space: normal !important; text-align: right; }
.libbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.libbar select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 8px; font-size: 16px; }
a { color: var(--accent); }
@media (max-width: 380px) { .scores { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <header>
    <h1>Snow的冰箱</h1>
    <p class="sub">選食材，看搭配、食譜和營養</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-fridge" aria-selected="true" data-tab="fridge">冰箱</button>
    <button class="tab" role="tab" id="t-lib" aria-selected="false" data-tab="lib">食譜</button>
    <button class="tab" role="tab" id="t-fav" aria-selected="false" data-tab="fav">收藏 <span id="favCount" class="num"></span></button>
  </nav>

  <section class="panel" id="p-fridge">
    <div class="scroller" id="catNav" role="group" aria-label="食材分類"></div>
    <div class="card" id="shelf"></div>
    <div class="card" id="pairs" hidden></div>
    <div class="card">
      <div class="row"><h2>已選食材</h2><button class="ghost" id="clear" type="button">清空</button></div>
      <div id="tray"></div>
    </div>
    <div class="card" id="result"></div>
    <div id="matches" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>

  <section class="panel" id="p-lib" hidden>
    <div class="scroller" id="methodNav" role="group" aria-label="料理方式"></div>
    <div class="libbar"><span class="hint" id="libCount"></span>
      <label class="hint">排序 <select id="libSort">
        <option value="default">預設</option><option value="health">最健康</option><option value="taste">最好吃</option><option value="protein">蛋白質最高</option><option value="kcal">熱量最低</option>
      </select></label></div>
    <div class="rlist" id="libList"></div>
  </section>

  <section class="panel" id="p-fav" hidden>
    <div id="favList" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>

  <p class="foot">營養依每 100g 常見參考值換算，外食與補給品為估算，實際以包裝標示為準。「好吃」分數是 Claude 的主觀評估，「健康」分數依蛋白質比例、蔬菜量、脂肪比例和澱粉種類計算。</p>
</div>

<div class="dock" id="dock" hidden>
  <div class="dock-in">
    <div id="dockText"></div>
    <button class="primary" id="dockGo" type="button">看食譜</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-in">
    <div class="sheet-top"><button class="back" id="sheetBack" type="button">‹ 返回</button></div>
    <div id="sheetBody" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>
</div>

    var mins = (r.pt || 0) + (r.ct || 0);
    var src = typeof r.src === 'string' ? SRC[r.src] : r.src;
    var h = '<div style="display:flex;flex-direction:column;gap:6px"><div class="meta"><span class="tag">' + esc(r.m) + '</span><span class="tag">' + esc(r.meal) + '</span>' + (r.tag ? '<span class="tag' + (r.tag === '熱門' || r.tag === '新' ? ' hot' : '') + '">' + esc(r.tag) + '</span>' : '') + '</div>' +
      '<h2 class="rname" id="sheetTitle">' + esc(r.n) + '</h2><p class="muted" style="margin:0;font-size:14px">' + esc(r.desc) + '</p>' +
      (mins ? '<div class="times"><span>備料 <b class="num">' + (r.pt || 0) + '</b> 分</span><span>烹調 <b class="num">' + (r.ct || 0) + '</b> 分</span><span>共 <b class="num">' + mins + '</b> 分</span></div>' : '') + '</div>';
    h += '<div class="card">';
    if (hasBig(r)) h += '<div class="toggle" role="group" aria-label="份量"><button type="button" data-big="0" aria-pressed="' + !big + '">減脂份</button><button type="button" data-big="1" aria-pressed="' + big + '">增肌份</button></div>';
    h += macroBlock(t) + '</div>';
    h += '<div class="card"><h2>Claude 評分</h2><div class="scores">' + meter('好吃', r.taste, 't') + meter('健康', hs.s, 'h') + '</div>' +
      (r.tn ? '<p style="margin:0;font-size:14px">' + esc(r.tn) + '</p>' : '') + '<p class="hint">健康分數：' + esc(hs.why.join('・')) + '</p></div>';
    h += section('食材', '<ul class="ing">' + items.map(function (x) { var f = FM[x.id]; return '<li><span>' + esc(f.n) + '</span><span>' + esc(amount(f, x.q)) + '</span></li>'; }).join('') +
      (r.season ? '<li><span>調味</span><span class="seas">' + esc(r.season) + '</span></li>' : '') + '</ul>');
    h += section('做法', '<ol class="steps">' + r.steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' +
      (r.done ? '<p class="notes"><b>熟了沒：</b>' + esc(r.done) + '</p>' : '') + (r.alt ? '<p class="notes"><b>其他做法：</b>' + esc(r.alt) + '</p>' : ''));
    var extra = '';
    if (r.tips && r.tips.length) extra += '<div class="kv"><b>小技巧</b><ul>' + r.tips.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    if (r.keep) extra += '<div class="kv"><b>保存與備餐</b><p>' + esc(r.keep) + '</p></div>';
    if (r.swap) extra += '<div class="kv"><b>食材替換</b><p>' + esc(r.swap) + '</p></div>';
    h += section('實用資訊', extra);
    h += '<div class="card"><div class="row"><div><div class="hint">' + (rec && rec.stars ? '我的評價（再點同一顆可取消）' : '我的評價：打星就收藏') + '</div>' + stars(rec ? rec.stars || 0 : 0, 'r-' + r.id) + '</div>' +
      '<button type="button" class="ghost" data-tofridge="' + esc(r.id) + '">放進冰箱改</button></div><div class="status" id="sheetStatus"></div>' +
      (src ? '<p class="hint">參考來源：' + (src.u ? '<a href="' + esc(src.u) + '" target="_blank" rel="noopener">' + esc(src.n) + '</a>' : esc(src.n)) + (r.added ? '（' + esc(r.added) + ' 加入）' : '') + '</p>' : '') + '</div>';
    $('sheetBody').innerHTML = h;
  }
  function renderFridge() { renderCats(); renderShelf(); renderPairs(); renderTray(); renderResult(); renderMatches(); renderDock(); }
  function renderAll() { renderFridge(); renderLib(); renderFav(); renderSheet(); }

  // ---------------------------------------------------------------- feed (recipes added on a schedule)
  function feedToRecipe(id, d) {
    if (!d || !d.n || !Array.isArray(d.items) || !Array.isArray(d.steps)) return null;
    var items = [];
    d.items.forEach(function (it, i) {
      if (!it) return;
      var q = Number(it.q) || 0, qb = it.qBig != null ? Number(it.qBig) : null;
      var known = it.id && FM[it.id] && String(it.id).indexOf('fx-') !== 0 && FM[it.id].cat !== 'custom';
      if (known && q > 0) { items.push(qb != null ? [it.id, q, qb] : [it.id, q]); return; }
      var fid = 'fx-' + id + '-' + i;
      FM[fid] = { id: fid, n: String(it.n || '食材'), s: String(it.n || '食材'), cat: it.cat || 'x', pu: 1, un: '', lab: String(it.label || (q ? q + (it.unit || 'g') : '')), g: 1,
        k: Number(it.k) || 0, p: Number(it.p) || 0, f: Number(it.f) || 0, c: Number(it.c) || 0, ready: 1 };
      items.push([fid, 1]);
    });
    if (!items.length) return null;
    return { id: 'f-' + id, feed: 1, n: String(d.n), m: METHODS.indexOf(d.m) >= 0 ? d.m : '平底鍋', meal: d.meal || '正餐', pt: Number(d.pt) || 0, ct: Number(d.ct) || 0,
      tag: '新', taste: Math.max(1, Math.min(5, Number(d.taste) || 3)), tn: d.tn || '', desc: d.desc || '', items: items, season: d.season || '',
      steps: d.steps.map(String), done: d.done || '', tips: Array.isArray(d.tips) ? d.tips.map(String) : [], keep: d.keep || '', swap: d.swap || '', alt: d.alt || '',
      src: d.src && d.src.n ? { n: String(d.src.n), u: /^https:\/\//.test(d.src.u || '') ? d.src.u : '' } : null, added: d.added || '' };
  }
  function applyFeed(docs) {
    FEED = docs.map(function (dd) { return feedToRecipe(dd.id, dd.data()); }).filter(Boolean)
      .sort(function (a, b) { return (b.added || '').localeCompare(a.added || ''); });
    indexRecipes(); COOC = null; HSC = {};
    renderAll();
  }

  // ---------------------------------------------------------------- storage
  var chain = Promise.resolve();
  function flash(id, msg) { var s = $(id); if (s) s.textContent = msg; }
  function lsSave() { try { localStorage.setItem(LS, JSON.stringify({ book: Array.from(book.entries()), custom: custom })); } catch (e) {} }
  function lsLoad() {
    try {
      var raw = localStorage.getItem(LS) || localStorage.getItem('snow-fridge-v2');
      if (raw) { var o = JSON.parse(raw); (o.book || []).forEach(function (e) { book.set(e[0], e[1]); }); custom = o.custom || []; }
    } catch (e) {}
  }
  function write(docId, val) {
    if (col) {
      chain = chain.then(function () { return val ? col.doc(docId).set(val) : col.doc(docId).delete(); })
        .catch(function () { flash('status', '儲存失敗，稍後再試'); flash('sheetStatus', '儲存失敗，稍後再試'); });
    }
    lsSave();
  }
  function rate(key, n) {
    var rec = book.get(key) || {};
    var next = Object.assign({}, rec, { stars: rec.stars === n ? 0 : n, ts: Date.now() });
    if (key.indexOf('r-') === 0) next.lib = key.slice(2);
    else {
      if (!next.items) {
        var r = generate(sel, genMode);
        next.items = sel.map(function (s) { return { id: s.id, q: s.q }; });
        next.name = r.title; next.m = r.m;
      }
      if (aiCache[key]) next.ai = aiCache[key];
    }
    if (!next.stars) { book.delete(key); write(key, null); } else { book.set(key, next); write(key, next); }
    renderAll();
    flash(key.indexOf('r-') === 0 ? 'sheetStatus' : 'status', next.stars ? '已收藏 ' + next.stars + ' 顆星' : '已取消收藏');
  }
  function saveCustom() { indexFoods(custom); write('custom-foods', { list: custom }); }

  // ---------------------------------------------------------------- Claude taste rating for a free combo
  var aiBusy = false;
  function askAi() {
    if (!sampleFn || aiBusy) return;
    var k = comboKey(sel), r = generate(sel, genMode), t = totals(sel);
    var lines = sel.map(function (s) { var f = FM[s.id]; return '- ' + cn(f) + ' ' + amount(f, s.q); }).join('\n');
    var prompt = '你是懂料理也懂運動營養的廚師。請評估這道料理（目標：增肌減脂）。\n' +
      '名稱：' + r.title + '\n料理方式：' + (GEN.filter(function (g) { return g.id === r.m; })[0] || {}).n + '\n食材：\n' + lines +
      '\n做法：' + r.steps.join(' ') + '\n營養：' + Math.round(t.k) + ' 大卡，蛋白質 ' + Math.round(t.p) + 'g，脂肪 ' + Math.round(t.f) + 'g，碳水 ' + Math.round(t.c) + 'g\n\n' +
      '請用 1 到 5 分（可以用 0.5）評「好吃程度」，考慮口味搭配、口感和調味。用繁體中文。只回一個 JSON：' +
      '{"taste": 4, "comment": "30 字內說明好不好吃、為什麼", "tip": "30 字內讓它更好吃的建議"}';
    aiBusy = true; flash('aiStatus', '思考中…');
    var btn = $('askAi'); if (btn) btn.disabled = true;
    sampleFn.json(prompt, { modelTier: 'quick' }).then(function (j) {
      var taste = Math.max(1, Math.min(5, Math.round((Number(j && j.taste) || 3) * 2) / 2));
      aiCache[k] = { taste: taste, comment: String((j && j.comment) || '').slice(0, 80), tip: String((j && j.tip) || '').slice(0, 80) };
      var rec = book.get(k);
      if (rec) { rec = Object.assign({}, rec, { ai: aiCache[k] }); book.set(k, rec); write(k, rec); }
      renderResult();
    }).catch(function (e) {
      var code = e && e.code;
      if (code === 'not_granted' || code === 'sampling_disabled' || code === 'capability_disabled' || code === 'capability_removed' || code === 'not_declared') { sampleFn = null; renderResult(); return; }
      flash('aiStatus', code === 'rate_limited' ? '太頻繁了，稍後再試' : '沒有成功，可以再按一次');
      var b = $('askAi'); if (b) b.disabled = false;
    }).then(function () { aiBusy = false; });
  }

  // ---------------------------------------------------------------- events
  function showTab(t) {
    ['fridge', 'lib', 'fav'].forEach(function (id) { $('p-' + id).hidden = id !== t; $('t-' + id).setAttribute('aria-selected', String(id === t)); });
    renderDock();
  }
  var lastFocus = null;
  function openSheet(id) {
    lastFocus = document.activeElement;
    sheetState = { id: id, big: false };
    renderSheet();
    $('sheet').hidden = false; $('sheet').scrollTop = 0;
    document.body.style.overflow = 'hidden';
    renderDock(); $('sheetBack').focus();
  }
  function closeSheet() {
    $('sheet').hidden = true; sheetState = null; document.body.style.overflow = '';
    renderDock();
    if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {}
  }
  function loadItems(items) {
    sel = items.map(function (x) { return { id: x.id, q: x.q }; }).filter(function (x) { return String(x.id).indexOf('fx-') !== 0; });
    focus = sel.length ? sel[0].id : null; genMode = 'auto';
    if (!$('sheet').hidden) closeSheet();
    showTab('fridge'); renderFridge();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('button'); if (!el) return;
    var d = el.dataset;
    if (el.id === 'sheetBack') return closeSheet();
    if (el.id === 'dockGo') return $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (el.id === 'clear') { sel = []; focus = null; return renderFridge(); }
    if (el.id === 'askAi') return askAi();
    if (d.tab) return showTab(d.tab);
    if (d.cat) { cat = d.cat; showCustomForm = false; renderCats(); return renderShelf(); }
    if (d.addcustom != null) { showCustomForm = d.addcustom === '1'; return renderShelf(); }
    if (d.delcustom) {
      custom = custom.filter(function (f) { return f.id !== d.delcustom; });
      sel = sel.filter(function (s) { return s.id !== d.delcustom; });
      saveCustom(); return renderFridge();
    }
    if (d.food) {
      var i = sel.findIndex(function (s) { return s.id === d.food; });
      if (i >= 0 && !d.pair) { sel.splice(i, 1); if (focus === d.food) focus = null; }
      else if (i < 0) { sel.push({ id: d.food, q: FM[d.food].g }); if (!d.pair) focus = d.food; }
      return renderFridge();
    }
    if (d.focus) { focus = d.focus; renderPairs(); return renderTray(); }
    if (d.inc || d.dec) {
      var id = d.inc || d.dec, it = sel.find(function (s) { return s.id === id; }), st = stepOf(FM[id]);
      if (!it) return;
      it.q = Math.max(st, Math.round((it.q + (d.inc ? st : -st)) * 10) / 10);
      return renderFridge();
    }
    if (d.rm) { sel = sel.filter(function (s) { return s.id !== d.rm; }); if (focus === d.rm) focus = null; return renderFridge(); }
    if (d.gen) { genMode = d.gen; return renderResult(); }
    if (d.lib) { libFilter = d.lib; return renderLib(); }
    if (d.open) return openSheet(d.open);
    if (d.big != null) { sheetState.big = d.big === '1'; return renderSheet(); }
    if (d.star) return rate(d.key, +d.star);
    if (d.tofridge) return loadItems(recItems(RM[d.tofridge], sheetState && sheetState.big));
    if (d.loadcombo) { var rec = book.get(d.loadcombo); if (rec) loadItems(normItems(rec.items)); }
  });
  document.addEventListener('change', function (e) { if (e.target.id === 'libSort') { libSort = e.target.value; renderLib(); } });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'cfForm') return;
    e.preventDefault();
    function num(id) { var v = parseFloat($(id).value); return isFinite(v) && v >= 0 ? Math.round(v * 10) / 10 : 0; }
    var name = $('cf-n').value.trim(); if (!name) return;
    var f = { id: 'cf' + Date.now().toString(36), n: name, s: name, cat: 'custom', pu: 1, un: ($('cf-u').value.trim() || '份'), g: 1, k: num('cf-k'), p: num('cf-p'), f: num('cf-f'), c: num('cf-c'), ready: 1 };
    custom.push(f); saveCustom();
    sel.push({ id: f.id, q: 1 }); focus = f.id;
    showCustomForm = false; renderFridge();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

  // ---------------------------------------------------------------- boot
  lsLoad();
  indexFoods(custom);
  indexRecipes();
  renderAll();
  (async function () {
    if (!window.claude || !window.claude.use) return;
    window.claude.use('sample').then(function (s) { if (s) { sampleFn = s; renderResult(); } }).catch(function () {});
    try {
      var res = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      var dbm = res[0], user = res[1];
      if (!dbm) return;
      try { dbm.collection('feed').onSnapshot(function (snap) { applyFeed(snap.docs); }, function () {}); } catch (e) {}
      var uid = user ? await user.id() : null;
      if (!uid) return;
      col = dbm.collection('data/users/' + uid);
      var first = true, localBook = new Map(book), localCustom = custom.slice();
      col.onSnapshot(function (snap) {
        var next = new Map(), cf = null;
        snap.docs.forEach(function (dd) {
          var v = dd.data();
          if (dd.id === 'custom-foods') cf = (v && v.list) || [];
          else if (v) next.set(dd.id, v);
        });
        if (first && !snap.metadata.fromCache) {
          first = false;
          localBook.forEach(function (v, k) { if (!next.has(k) && v && v.stars) { next.set(k, v); write(k, v); } });
          if (!cf && localCustom.length) { cf = localCustom; write('custom-foods', { list: cf }); }
        }
        book = next;
        if (cf) { custom = cf; indexFoods(custom); }
        lsSave();
        renderAll();
      }, function () { col = null; });
    } catch (e) { col = null; }
  })();

})();
</script>

</body></html>
